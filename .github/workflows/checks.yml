name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm contracts:check
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kilora
          POSTGRES_PASSWORD: kilora
          POSTGRES_DB: kilora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kilora -d kilora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://kilora:kilora@localhost:5432/kilora_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Apply migrations to fresh database
        working-directory: services/api
        run: go tool goose -dir ../../db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Test API including database-backed flows
        working-directory: services/api
        run: go test -race ./...
      - name: Vet API
        working-directory: services/api
        run: go vet ./...
