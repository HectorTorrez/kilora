name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm contracts:check
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kilora
          POSTGRES_PASSWORD: kilora
          POSTGRES_DB: kilora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kilora -d kilora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://kilora:kilora@localhost:5432/kilora_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Apply migrations to fresh database
        working-directory: services/api
        run: go tool goose -dir ../../db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Test API including database-backed flows
        working-directory: services/api
        run: go test -race ./...
      - name: Vet API
        working-directory: services/api
        run: go vet ./...

  deployment:
    runs-on: ubuntu-latest
    env:
      DOMAIN: release-test.example
      POSTGRES_PASSWORD: testonly0123456789abcdef
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      RESEND_API_KEY: test-only-not-a-real-key
      EMAIL_FROM: no-reply@release-test.example
      RELEASE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate production configuration
        run: docker compose -f compose.production.yaml config --quiet
      - name: Build production images
        run: docker compose -f compose.production.yaml build
      - name: Check production scripts
        run: |
          bash -n scripts/production/*.sh
          python3 -c "from pathlib import Path; compile(Path('scripts/production/smoke.py').read_text(), 'smoke.py', 'exec')"
