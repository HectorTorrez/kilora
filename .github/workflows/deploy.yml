name: Deploy

# Corre solo cuando "Release checks" (checks.yml) pasa en main,
# o a mano desde la pestaña Actions.
on:
  workflow_run:
    workflows: ["Release checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      demo_mode:
        description: Public demo access in Dokploy
        type: choice
        default: unchanged
        options:
          - unchanged
          - 'true'
          - 'false'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Docker exige minúsculas; debe coincidir con GHCR_OWNER en deploy/compose.prod.yaml.
  IMAGE_PREFIX: ghcr.io/hectortorrez

jobs:
  images:
    name: Build & push images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: kilora-api
            dockerfile: services/api/Dockerfile
          - name: kilora-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VITE_SITE_URL=${{ vars.SITE_URL || 'https://kilora.dev' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Dokploy
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      # El panel de Dokploy solo es accesible por Tailscale: el runner se une
      # a la tailnet (nodo efímero con tag:ci) solo durante este job.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Dokploy compose deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          DEMO_MODE_OVERRIDE: ${{ inputs.demo_mode || 'unchanged' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          mode = os.environ['DEMO_MODE_OVERRIDE']
          if mode == 'unchanged':
              raise SystemExit(0)
          if mode not in ('true', 'false'):
              raise SystemExit('Invalid demo mode')
          base = os.environ['DOKPLOY_URL'].rstrip('/')
          compose_id = os.environ['DOKPLOY_COMPOSE_ID']
          headers = {'x-api-key': os.environ['DOKPLOY_API_KEY'], 'Content-Type': 'application/json'}

          def call(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(base + '/api/' + path, data=data, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'Dokploy request failed: HTTP {error.code}') from None

          compose = call('compose.one?' + urllib.parse.urlencode({'composeId': compose_id}))
          env = compose.get('env') or ''
          pattern = r'(?m)^(?:export[ \t]+)?DEMO_MODE[ \t]*=.*$'
          setting = 'DEMO_MODE=' + mode
          env = re.sub(pattern, setting, env) if re.search(pattern, env) else env.rstrip('\n') + '\n' + setting + '\n'
          call('compose.saveEnvironment', {'composeId': compose_id, 'env': env, 'createEnvFile': compose.get('createEnvFile', False)})
          print('Updated DEMO_MODE=' + mode + ' in Dokploy')
          PY
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"${DOKPLOY_COMPOSE_ID}\"}"
