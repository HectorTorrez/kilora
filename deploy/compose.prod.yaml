# Stack de producción para Dokploy (tipo "Docker Compose").
# GitHub Actions publica las imágenes en GHCR; las variables se definen
# en la pestaña "Environment" del compose en Dokploy.
# Dominios (pestaña "Domains"): mismo host para ambos servicios,
#   web → path "/"    puerto 3000
#   api → path "/api" puerto 8080 (sin "strip path")
name: kilora

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kilora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kilora}
      TZ: America/El_Salvador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    image: ghcr.io/${GHCR_OWNER:-hectortorrez}/kilora-api:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kilora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kilora}?sslmode=disable
      APP_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:?define WEB_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET:?define SESSION_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:?define RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@kilora.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      # El API rechaza DEMO_MODE=true en producción.
      DEMO_MODE: "false"
      # Red de Traefik (dokploy-network): solo se confía en su X-Forwarded-For.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-10.0.1.0/24}
    expose:
      - "8080"

  web:
    image: ghcr.io/${GHCR_OWNER:-hectortorrez}/kilora-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # El SSR llama al API por la red interna, sin salir a internet.
      API_INTERNAL_URL: http://api:8080
    expose:
      - "3000"

volumes:
  pgdata:
